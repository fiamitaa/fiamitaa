name: 靜態網頁自動生成 Sitemap 並提交 IndexNow

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'        # 監控首頁變動
      - 'README.md'         # 監控 README 變動
      - 'about/**'          # 監控 about 目錄變動
      - 'articles/**'       # 🌟 需求符合：精確監控 articles 目錄及其子目錄

  workflow_dispatch: # 保留手動觸發按鈕

jobs:
  generate-and-submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 必須開啟寫入權限，才能把生成的 sitemap.xml 推回 GitHub
    steps:
      # 1. 下載專案原始碼（必須設定 fetch-depth: 0 才能讀取到正確的檔案修改日期）
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 2. 設定 Node.js 環境
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 3. 🌟 自動建構與原版完全一致、且帶有 <lastmod> 日期的 sitemap.xml
      - name: Generate Sitemap
        run: |
          node -e '
          const fs = require("fs");
          const { execSync } = require("child_process");

          // 1. 精確設定你的專案網域
          const BASE_URL = "https://ladderer.win"; 

          // 2. 初始化網址清單（首頁）
          let urlEntries = [];
          
          // 抓取檔案 Git 修改時間的共用函數
          function getGitDate(file) {
            try {
              return execSync(`git log -1 --format=%cI -- "${file}"`).toString().trim();
            } catch (e) {
              return new Date().toISOString();
            }
          }

          // 首頁處理
          if (fs.existsSync("index.html")) {
            urlEntries.push({ loc: `${BASE_URL}/`, date: getGitDate("index.html") });
          }

          // 遞迴掃描目錄，將本地檔案路徑映射為精確的乾淨網址
          function scanDirectory(dir) {
            if (!fs.existsSync(dir)) return;
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = dir + "/" + file;
              if (fs.statSync(fullPath).isDirectory()) {
                scanDirectory(fullPath);
              } else if (file === "index.html") {
                // 如果是 articles/what-is-network-proxy/index.html
                // 轉換為標準乾淨網址：https://ladderer.win/articles/what-is-network-proxy/
                const cleanPath = dir + "/";
                urlEntries.push({ loc: `${BASE_URL}/${cleanPath}`, date: getGitDate(fullPath) });
              } else if (fullPath.endsWith(".html")) {
                // 防止有單獨非 index.html 的靜態頁面
                const cleanPath = fullPath.replace(".html", "/");
                urlEntries.push({ loc: `${BASE_URL}/${cleanPath}`, date: getGitDate(fullPath) });
              }
            }
          }

          // 掃描你的核心文章與關於目錄
          scanDirectory("articles");
          scanDirectory("about");

          // 開始組裝標準 XML
          let xml = `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`;
          for (const entry of urlEntries) {
            xml += `  <url>\n    <loc>${entry.loc}</loc>\n    <lastmod>${entry.date}</lastmod>\n  </url>\n`;
          }
          xml += `</urlset>`;

          fs.writeFileSync("sitemap.xml", xml);
          console.log("🎉 sitemap.xml 已完美生成！");
          '

      # 4. 檢查 sitemap.xml 是否有變動，有的話就自動推回你的 GitHub 倉庫
      - name: Commit and Push Sitemap
        run: |
          git config --local user.email "202410717+fiamitaa@users.noreply.github.com"
          git config --local user.name "fiamitaa"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated sitemap update for static site [skip ci]" && git push)
 
      # 5. 動態等待，每 15 秒檢查一次線上 sitemap，最多等 3 分鐘
      # 這是為了確保 GitHub Pages 後台已經把你的新文檔和新 Sitemap 編譯並發布上線了
      - name: Wait for GitHub Pages to Deploy
        run: |
          echo "正在等待 GitHub Pages 雲端編譯與部署完成..."
          sleep 40 # 先行強制等待 40 秒，給 GitHub Pages 後台反應時間
          
          for i in {1..12}; do
            echo "檢查線上 Sitemap 是否已就緒... (嘗試 $i/12)"
            curl -sL https://ladderer.win/sitemap.xml > /tmp/online_sitemap.xml
            # 檢查線上的 sitemap 是否已經成功包含了 lastmod 標籤
            if grep -q "<lastmod>" /tmp/online_sitemap.xml; then
               echo "🎉 線上 Sitemap 已成功生成，且包含時間欄位！"
               break
            fi
            sleep 15
          done

      # 6. 執行 IndexNow 提交（無警告版）
      - name: 執行 IndexNow 提交
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: 'https://ladderer.win/sitemap.xml'
          key: ${{ secrets.INDEXNOW_KEY }}
          since: 1
          since-unit: 'day'
